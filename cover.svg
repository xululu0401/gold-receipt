  <text x="140" y="295" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="40" fill="#545046">金饰今天回收能拿回多少，差的钱在哪</text>
  <text x="140" y="400" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="#8a8478">30 克足金手镯：付 39,980 元，今天回收拿回 30,150 元</text>
  <text x="140" y="506" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#545046">实付</text><rect x="330" y="470" width="560" height="48" fill="#f6f2e9"/><rect x="330" y="470" width="560" height="48" fill="#23201a"/><text x="1060" y="507" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#23201a">39,980</text><text x="140" y="584" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#545046">工费和溢价</text><rect x="330" y="548" width="560" height="48" fill="#f6f2e9"/><rect x="825.847923961981" y="548" width="64.15207603801902" height="48" fill="#b98a2e"/><text x="1060" y="585" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#23201a">−4,580</text><text x="140" y="662" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#545046">金价变动</text><rect x="330" y="626" width="560" height="48" fill="#f6f2e9"/><rect x="758.6143071535768" y="626" width="67.23361680840421" height="48" fill="#c9725f"/><text x="1060" y="663" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#23201a">−4,800</text><text x="140" y="740" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#545046">回收扣</text><rect x="330" y="704" width="560" height="48" fill="#f6f2e9"/><rect x="752.3111555777889" y="704" width="6.3031515757878935" height="48" fill="#9a948a"/><text x="1060" y="741" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#23201a">−450</text><text x="140" y="818" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" fill="#545046">拿回</text><rect x="330" y="782" width="560" height="48" fill="#f6f2e9"/><rect x="330" y="782" width="422.3111555777889" height="48" fill="#2f6b4f"/><text x="1060" y="819" text-anchor="end" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#23201a">30,150</text>
